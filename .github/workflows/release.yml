name: Build and Release

# バージョンタグ (例: v1.5.1) を push すると、Windows上で .exe をビルドし
# GitHub Releases に ZIP・exe・version.json を自動公開します。
# 配布済みアプリは releases/latest/download/version.json を見て自動更新します。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # リリース作成に必要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          (Get-Content voice_input/__init__.py -Raw) `
            -replace '__version__\s*=\s*"[^"]*"', "__version__ = `"$v`"" |
            Set-Content voice_input/__init__.py -Encoding utf8 -NoNewline
          Write-Host "Building version $v"

      - name: Build exe (PyInstaller)
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets/app.ico") { $iconArg = @("--icon", "assets/app.ico") }
          # アプリが使う Qt モジュールは QtCore / QtGui / QtWidgets の3つだけ。
          # PySide6 全体を収集すると QtWebEngine(Chromium) 等で約290MBに肥大するため、
          # 自動収集はやめ、未使用の巨大モジュールを明示除外してサイズを削減する。
          $excludeQt = @(
            "PySide6.QtWebEngineCore","PySide6.QtWebEngineWidgets","PySide6.QtWebEngineQuick",
            "PySide6.QtWebChannel","PySide6.QtWebSockets","PySide6.QtWebView",
            "PySide6.QtQml","PySide6.QtQmlModels","PySide6.QtQuick","PySide6.QtQuick3D",
            "PySide6.QtQuickWidgets","PySide6.QtQuickControls2",
            "PySide6.QtMultimedia","PySide6.QtMultimediaWidgets","PySide6.QtSpatialAudio",
            "PySide6.QtPdf","PySide6.QtPdfWidgets",
            "PySide6.QtCharts","PySide6.QtDataVisualization","PySide6.QtGraphs",
            "PySide6.Qt3DCore","PySide6.Qt3DRender","PySide6.Qt3DInput","PySide6.Qt3DLogic",
            "PySide6.Qt3DAnimation","PySide6.Qt3DExtras",
            "PySide6.QtDesigner","PySide6.QtUiTools","PySide6.QtHelp","PySide6.QtTest",
            "PySide6.QtSql","PySide6.QtNetworkAuth","PySide6.QtRemoteObjects",
            "PySide6.QtBluetooth","PySide6.QtNfc","PySide6.QtPositioning","PySide6.QtLocation",
            "PySide6.QtSerialPort","PySide6.QtSerialBus","PySide6.QtSensors",
            "PySide6.QtScxml","PySide6.QtStateMachine","PySide6.QtTextToSpeech"
          ) | ForEach-Object { @("--exclude-module", $_) }
          pyinstaller `
            --name VoiceInputStudio `
            --windowed `
            --onefile `
            --noconsole `
            --add-data "assets;assets" `
            --hidden-import google.generativeai `
            @excludeQt `
            @iconArg `
            voice_input/__main__.py
          if (-not (Test-Path "dist/VoiceInputStudio.exe")) {
            Write-Error ".exe が生成されませんでした"; exit 1
          }

      - name: Package release assets
        shell: pwsh
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/VoiceInputStudio.exe release/VoiceInputStudio.exe -Force

          # 自動更新マニフェスト。exe_url は「最新リリースの固定URL」=永続的。
          $exeUrl = "https://github.com/${{ github.repository }}/releases/latest/download/VoiceInputStudio.exe"
          $manifest = [ordered]@{
            version = "${{ steps.ver.outputs.version }}"
            exe_url = $exeUrl
            notes   = "$env:NOTES"
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content release/version.json -Encoding utf8

          # 初回配布用ZIP (exe + ガイド)
          $zipItems = @("dist/VoiceInputStudio.exe")
          $guide = "release/はじめにお読みください.txt"
          if (Test-Path $guide) { $zipItems += $guide }
          Compress-Archive -Path $zipItems -DestinationPath "release/VoiceInputStudio-${{ github.ref_name }}.zip" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          $zip = (Get-ChildItem release/VoiceInputStudio-*.zip | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" `
            "release/VoiceInputStudio.exe" `
            "release/version.json" `
            "$zip" `
            --title "${{ github.ref_name }}" `
            --notes "$env:NOTES"
